name: Reproducible

# After every Stable tag (release.yml dispatches it) or by hand: rebuilds the arm64 APK and checks it is the release's.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild and compare (v1.18.3 or later)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # The release's own build with the signing left out; KARASU_NO_SELF_UPDATE is F-Droid's alone and compiles code out.
      KARASU_UNSIGNED: "1"
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/home/runner/.cargo=/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Pin build time to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build the arm64 APK, unsigned
        run: npx tauri android build --apk --target aarch64 --split-per-abi

      - name: Fetch the release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --pattern "*_arm64.apk" --dir release-apk

      # A rebuild that verifies under the release's own signature is the proof the published APK is this source.
      - name: Compare
        run: |
          python3 -m pip install --quiet apksigcopier
          # apksigcopier shells out to apksigner, which the runner keeps under build-tools rather than on PATH.
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          ours=$(ls src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk | head -1)
          theirs=$(ls release-apk/*.apk | head -1)
          echo "rebuilt: $ours"
          echo "released: $theirs"
          # The signed release comes first: compare copies its signature onto the unsigned rebuild and verifies the result.
          apksigcopier compare --unsigned "$theirs" "$ours" && echo "::notice::Reproducible: the rebuilt APK matches the release"

      # Kept, because a mismatch says only that the two differ; finding where takes the rebuild beside the release.
      - name: Keep the rebuilt APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rebuilt-apk
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: warn
          retention-days: 7
