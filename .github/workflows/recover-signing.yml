# One-off: hands the Android signing secrets back to the maintainer, encrypted to an age key only they hold.
name: Recover signing key

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Your age public key (age1...); only its private half can open the artifact"
        required: true
        type: string

permissions: {}

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the recipient
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set -euo pipefail
          if ! [[ "$RECIPIENT" =~ ^age1[02-9ac-hj-np-z]{58}$ ]]; then
            echo "::error::The recipient is not an age public key (age1 followed by 58 characters)."
            exit 1
          fi

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Encrypt the keystore and its passwords
        env:
          RECIPIENT: ${{ inputs.recipient }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work/karasu-signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$work/karasu-signing/karasu.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "karasu.keystore" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > "$work/karasu-signing/key.properties"
          tar -C "$work" -cf - karasu-signing | age -r "$RECIPIENT" -o "$RUNNER_TEMP/karasu-signing.tar.age"
          rm -rf "$work"
          ls -l "$RUNNER_TEMP/karasu-signing.tar.age"

      - name: Upload the encrypted file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: karasu-signing-encrypted
          path: ${{ runner.temp }}/karasu-signing.tar.age
          retention-days: 1
          if-no-files-found: error
