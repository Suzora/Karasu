name: Workflows

# Lints the workflows themselves, for syntax and for security, whenever one of them changes.
on:
  push:
    branches: ["main"]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner carries shellcheck, so every bash step is checked too.
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint

      # With a token zizmor also runs its online audits: known-vulnerable actions and commits a tag does not hold.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 .github/workflows
