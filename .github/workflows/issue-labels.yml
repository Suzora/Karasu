name: Issue labels

# Labels and the issue type from the form's answers: kind from its headings, platform from a dropdown or the OS row.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body ?? "";

            // The first non-empty line under a "### <label>" heading; plain indexOf, since the labels carry question marks.
            const answer = (label) => {
              const heading = `### ${label}`;
              const at = body.indexOf(heading);
              if (at === -1) return "";
              const line = body
                .slice(at + heading.length)
                .split("\n")
                .map((l) => l.trim())
                .find((l) => l !== "");
              return line ?? "";
            };

            const labels = new Set();

            // Type, from headings only one form renders; two per form, since a reporter may delete the first section.
            if (/^### (What happened\?|Steps to reproduce)/m.test(body)) labels.add("bug");
            if (/^### (What is the problem\?|What should it do instead\?)/m.test(body)) labels.add("enhancement");

            // Platform: the feature form asks outright; a bug report says it in the install dropdown or the diagnostics OS row.
            const platform = answer("Does this apply to a particular platform?").toLowerCase();
            const install = answer("How did you install it?").toLowerCase();
            const os = (body.match(/^\|\s*OS\s*\|\s*([a-z]+)\b/mi)?.[1] ?? "").toLowerCase();
            for (const name of ["windows", "linux", "android"]) {
              if (platform === name || os === name || install.startsWith(name)) labels.add(name);
            }

            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number };

            // The type from the same headings, for an issue the form's `type:` line did not reach; never overwrites one.
            const type = labels.has("bug") ? "Bug" : labels.has("enhancement") ? "Feature" : null;
            if (type && !context.payload.issue.type) {
              await github.rest.issues.update({ ...issue, type });
              core.info(`type: ${type}`);
            }

            const have = new Set(context.payload.issue.labels.map((l) => l.name));
            const add = [...labels].filter((l) => !have.has(l));
            if (add.length === 0) {
              core.info("no label to add");
              return;
            }
            await github.rest.issues.addLabels({ ...issue, labels: add });
            core.info(`added: ${add.join(", ")}`);
