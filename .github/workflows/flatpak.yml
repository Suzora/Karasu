name: Flatpak

# After every Stable tag (release.yml dispatches it) or by hand: fills, lints and builds the from-source Flatpak once.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the manifest builds from source (a Stable after v1.32.0; older tags have no source build)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # pwsh, uv and appstreamcli live on the runner, not in the builder image, so the filled files travel as an artifact.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The script runs the pinned flatpak-builder-tools generators through uv.
      - name: Install uv
        run: pipx install uv

      - name: Fill the manifest from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/flatpak-manifest.ps1 -Tag "${{ inputs.tag }}" -OutDir flatpak-out

      # Flathub runs the same validator; a failure here is the review comment before the review.
      - name: Validate the metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate --pedantic flatpak-out/io.github.Suzora.Karasu.metainfo.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flatpak-manifest
          path: flatpak-out
          retention-days: 7

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flatpak-manifest
          path: flatpak-out

      # Flathub's own linter, from the same Builder app its reviewers run.
      - name: Lint the manifest
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak-out/io.github.Suzora.Karasu.yml

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: karasu.flatpak
          manifest-path: flatpak-out/io.github.Suzora.Karasu.yml
          # With this the action composes full media URLs and commits the screenshots, which the repository lint checks.
          mirror-screenshots-url: https://dl.flathub.org/media/
          cache: false
          upload-artifact: true

      - name: Lint the built repository
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
