# Flatpak manifest for Karasu, built from source; scripts/release/flatpak-manifest.ps1 fills the source and the vendored sources.
id: io.github.Suzora.Karasu
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: karasu

finish-args:
  # Wayland first, X11 where that is what runs, and the GPU for WebKitGTK.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # AniList, Jellyfin on the LAN (its UDP discovery included) and the localhost OAuth callback.
  - --share=network
  # The tray is a StatusNotifier item; the media-session pass reads every MPRIS player on the bus.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.mpris.MediaPlayer2.*
  # The AniList token rests in the Secret Service.
  - --talk-name=org.freedesktop.secrets
  # Toasts go to the notification daemon by name, which the portal does not stand in for.
  - --talk-name=org.freedesktop.Notifications
  # Discord's rich presence socket, for the native client and for Discord's own Flatpak.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  # The local library scanner reads the folders the user picks in the file dialog, which the portal grants per choice.
  - --filesystem=xdg-videos:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/karasu/cargo
    # Flathub updates the app; read by `option_env!` at build time, it turns the in-app check, offer and install off.
    KARASU_NO_SELF_UPDATE: "1"

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: karasu
    buildsystem: simple
    build-options:
      env:
        npm_config_cache: /run/build/karasu/flatpak-node/npm-cache
        npm_config_offline: "true"
        XDG_CACHE_HOME: /run/build/karasu/flatpak-node/cache
    build-commands:
      - npm ci --offline --ignore-scripts
      - npm run build
      # What `tauri build` passes; without it the binary would load the dev server's address.
      - cargo --offline build --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/karasu /app/bin/karasu
      # Tauri resolves its resources in the lib folder beside the binary's, named after the product.
      - install -Dm644 -t /app/lib/Karasu THIRD-PARTY-NOTICES.md
      - install -Dm644 packaging/flatpak/io.github.Suzora.Karasu.desktop /app/share/applications/io.github.Suzora.Karasu.desktop
      - install -Dm644 io.github.Suzora.Karasu.metainfo.xml /app/share/metainfo/io.github.Suzora.Karasu.metainfo.xml
      - for s in 32 64 128; do install -Dm644 src-tauri/icons/${s}x${s}.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.Suzora.Karasu.png; done
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.Suzora.Karasu.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.Suzora.Karasu.png
    sources:
      - SOURCE_TO_FILL
      # Filled from the tag, since the copy in the tree carries placeholders for the release.
      - type: file
        path: io.github.Suzora.Karasu.metainfo.xml
      - cargo-sources.json
      - node-sources.json
