AntiFeatures:
  NonFreeNet:
    en-US: Everything it shows and writes goes through AniList, a proprietary online
      service.
Categories:
  - Internet
  - Multimedia
License: AGPL-3.0-or-later
AuthorName: Kyu
WebSite: https://suzora.github.io/Karasu/
SourceCode: https://github.com/Suzora/Karasu
IssueTracker: https://github.com/Suzora/Karasu/issues
Changelog: https://github.com/Suzora/Karasu/blob/HEAD/CHANGELOG.md

AutoName: Karasu

RepoType: git
Repo: https://github.com/Suzora/Karasu

Builds:
  - versionName: VERSION_TO_FILL
    versionCode: VERSIONCODE_TO_FILL
    commit: TAG_TO_FILL
    subdir: src-tauri/gen/android/app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends curl ca-certificates build-essential
        pkg-config xz-utils
      - curl -fsSL -o /tmp/node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz -C /opt
      - ln -sf /opt/node-v22.23.3-linux-x64/bin/node /opt/node-v22.23.3-linux-x64/bin/npm
        /opt/node-v22.23.3-linux-x64/bin/npx /usr/local/bin/
    init:
      - curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1 --profile
        minimal
      - . $HOME/.cargo/env && rustup target add aarch64-linux-android
      - cd ../../../.. && npm ci
      - cd ../../../.. && rm -f node_modules/playwright-core/lib/webp_codec.wasm node_modules/@typescript/typescript-linux-x64/lib/tsc
        node_modules/@astrojs/compiler/dist/astro.wasm node_modules/source-map/lib/mappings.wasm
    output: build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk
    build:
      - . $HOME/.cargo/env
      - export KARASU_NO_SELF_UPDATE=1 KARASU_UNSIGNED=1
      - export RUSTFLAGS="--remap-path-prefix=$(cd ../../../.. && pwd)=/build --remap-path-prefix=$HOME/.cargo=/cargo"
      - ln -s "$(command -v gradle)" ../gradlew
      - cd ../../../.. && npx tauri android build --apk --target aarch64 --split-per-abi
    ndk: r27b

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - '%c + 1000000'
UpdateCheckData: src-tauri/src/commands/update.rs|COMMIT_NUMBER:\s*u32\s*=\s*(\d+);|.|FULL_VERSION:\s*&str\s*=\s*"([^"]+)";
CurrentVersion: VERSION_TO_FILL
CurrentVersionCode: VERSIONCODE_TO_FILL
